[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gabriel-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "httpx",
    "cryptography",
    "alembic",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pgvector",
    "uuid7",
    "langchain-core",
    "langchain-ollama",
    "langgraph",
    "rich",
]

[project.optional-dependencies]
# High-fidelity document ingestion (normalizer falls back gracefully without these).
ingest = ["docling", "PyMuPDF", "python-docx", "beautifulsoup4"]
dev = ["pytest", "pytest-asyncio", "aiosqlite", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
